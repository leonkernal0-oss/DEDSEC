<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemoteDesk - Device Control Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; width: 100%; overflow: hidden; }
      body { background: #0a0e1a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      
      /* Loading indicator */
      #root:empty::before {
        content: 'Loading RemoteDesk...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 18px;
        color: #64748b;
      }
      
      /* Error display */
      .app-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 20px;
        text-align: center;
      }
      .app-error h1 {
        font-size: 24px;
        color: #ef4444;
        margin-bottom: 10px;
      }
      .app-error pre {
        background: #1e293b;
        padding: 15px;
        border-radius: 8px;
        max-width: 600px;
        overflow: auto;
        font-size: 12px;
        color: #f87171;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-error">
        <h1>Loading...</h1>
        <p style="color: #94a3b8;">If you see this for more than 5 seconds, check browser console (F12)</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Global error handler
      window.addEventListener('error', function(event) {
        console.error('Global error:', event.error);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div class="app-error"><h1>Error Loading App</h1><pre>' + 
            (event.error ? event.error.stack || event.error.message : 'Unknown error') + 
            '</pre><p style="color: #94a3b8; margin-top: 10px;">Check browser console for details</p></div>';
        }
      });
    </script>
  </body>
</html>
